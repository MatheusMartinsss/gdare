# Uso na VPS:
#   docker build -t gdare:latest .
#   docker compose up -d
# O nginx de api.calculadoraicms.online continua apontando para 127.0.0.1:8081.
services:
  gdare:
    image: gdare:latest
    container_name: gdare
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    # O Chrome usa /dev/shm; o padrão do Docker (64MB) é pequeno.
    shm_size: "512mb"
    # Limite para um Chrome travado não derrubar o gflona na mesma VPS.
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
