# Deploy do gdare do GeraGuia.
# Push na master: build -> registry.gflona.com.br/gdare:{sha,latest}
# -> na VPS, troca só o serviço "gdare" da stack /opt/geraguia
#    (o compose fica no repositório icms-ro, em deploy/docker-compose.prod.yml).
# O gdare antigo (container "gdare", porta 8081, calculadoraicms.online) não é tocado.
#
# Rollback manual na VPS:
#   cd /opt/geraguia && GDARE_TAG=<sha antigo> docker compose -f docker-compose.prod.yml up -d --no-deps gdare

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-geraguia-gdare
  cancel-in-progress: false

env:
  REGISTRY: registry.gflona.com.br
  IMAGE: registry.gflona.com.br/gdare
  DEPLOY_PATH: /opt/geraguia

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar sintaxe
        run: |
          for f in index.js $(find src -name "*.js"); do node --check "$f"; done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Subir a versão nova
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            export GDARE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull gdare
            docker compose -f docker-compose.prod.yml up -d --no-deps gdare

            for i in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' geraguia-gdare 2>/dev/null || echo "?")
              if [ "$status" = "healthy" ]; then
                echo "gdare no ar: ${{ github.sha }}"
                docker image prune -f > /dev/null
                exit 0
              fi
              sleep 3
            done
            echo "O gdare não ficou healthy (status: $status)"
            docker compose -f docker-compose.prod.yml logs --tail 80 gdare
            exit 1
